services:
  - type: web
    name: ml-metrics-app
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: DATA_URL
        sync: false   # Pon aquí un link directo a tu .pkl.gz (opcional)
      - key: TARGET_COL
        value: ""     # Ej: "label"
